<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-wrapper">
    <section class="login-card">
      <h1>Masuk</h1>
      <p class="subtitle">Login sebagai Admin/Moderator untuk Dashboard, Operator, Ambil Antrian dan Layar.
        Login sebagai User untuk Ambil Antrian dan Layar Antrian.</p>

      <div id="errorBox" class="error-box" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submitBtn" class="btn btn-accent btn-block" type="submit">Masuk</button>
      </form>

      <p class="hint">
        <button type="button" class="link-btn" id="fillAdmin">akun admin</button> ·
        <button type="button" class="link-btn" id="fillUser">akun user</button>
      </p>
    </section>
  </main>
  <script src="dist/common.js" defer></script>
  <script src="dist/login.js" defer></script>
</body>
</html>
